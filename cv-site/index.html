<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free CV Maker - Build your resume free, no sign-up</title>
<meta name="description" content="Build a professional one-page resume for free in minutes and download it as PDF. No sign-up, no watermark, and your data never leaves your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#4f46e5;--ui:#4f46e5;--bg:#f6f7fb;--card:#fff;--fg:#0f172a;--mut:#64748b;--bd:#e2e8f0;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.6}
/* hero */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#db2777);color:#fff;text-align:center;padding:44px 16px 84px}
.hero .pill{display:inline-block;background:#ffffff26;border:1px solid #ffffff55;padding:4px 16px;border-radius:99px;font-size:.85rem;font-weight:600}
.hero h1{margin:14px 0 8px;font-size:clamp(1.9rem,5vw,3rem);font-weight:800;line-height:1.25}
.hero h1 small{display:block;font-size:.4em;font-weight:600;opacity:.85;letter-spacing:.08em;margin-top:2px}
.hero p{margin:0 auto;max-width:560px;opacity:.95;font-size:1.05rem}
.feats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;margin-top:20px;font-size:.9rem;font-weight:600}
.feats span::before{content:"✓ ";color:#a7f3d0}
.cta{display:inline-block;margin-top:22px;background:#fff;color:#4f46e5;font-weight:800;padding:12px 30px;border-radius:99px;text-decoration:none;box-shadow:0 8px 24px #0003}
/* app */
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:24px;max-width:1240px;margin:-52px auto 0;padding:0 16px 60px;position:relative}
@media(max-width:940px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 10px 30px #0f172a14;align-self:start}
.panel h1{display:none}.sub{display:none}
.step{display:flex;align-items:center;gap:10px;margin:22px 0 4px;font-weight:700}
.step:first-child{margin-top:0}
.step i{font-style:normal;background:var(--ui);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;font-size:.92rem;background:#fff;color:var(--fg);transition:.15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ui);box-shadow:0 0 0 3px #4f46e522}
textarea{min-height:76px;resize:vertical}
fieldset{border:0;margin:0;padding:0}legend{display:none}
.item{background:#f8fafc;border:1px solid var(--bd);border-radius:12px;padding:6px 12px 12px;margin-top:10px;position:relative}
.item .rm{position:absolute;top:6px;inset-inline-end:8px;border:0;background:#fee2e2;color:#dc2626;width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.top{grid-template-columns:1fr 1.5fr}
.colors{flex-wrap:wrap}
button.add{margin-top:10px;width:100%;border:1.5px dashed var(--ui);color:var(--ui);background:#eef2ff;padding:9px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.colors{display:flex;gap:10px;margin-top:4px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--bd);cursor:pointer}
.colors button.on{box-shadow:0 0 0 2.5px var(--fg)}
.actions{display:flex;gap:10px;margin-top:22px}
.actions button{padding:13px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.pdf{flex:2;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 6px 18px #4f46e555}
.clr{flex:1;background:#f1f5f9;color:var(--mut)}
.note{font-size:.78rem;color:var(--mut);margin:12px 0 0;text-align:center}
.preview{position:sticky;top:12px;align-self:start}
.pvhead{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px;font-weight:700;font-size:.9rem}
.sheet{background:#fff;width:210mm;min-height:297mm;max-width:100%;margin:0 auto;padding:0;box-shadow:0 14px 40px #0f172a33;border-radius:4px;color:#111;font-size:10.5pt;line-height:1.55;overflow:hidden}
.sheet .hd{background:var(--acc);color:#fff;padding:14mm 15mm 9mm}
.sheet h2{margin:0;font-size:26pt;line-height:1.2;font-weight:800}
.sheet .title{font-size:13pt;opacity:.92;margin:2px 0 8px}
.sheet .contact{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:9.5pt;opacity:.95}
.sheet .bd{padding:6mm 15mm 14mm}
.sheet h3{color:var(--acc);font-size:11.5pt;margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-weight:800}
.sheet h3::after{content:"";flex:1;height:1.5px;background:var(--acc);opacity:.25}
.sheet .e{margin-bottom:9px}.sheet .e b{font-size:11pt}.sheet .d{color:#64748b;font-size:9pt}
.sheet p{margin:2px 0;white-space:pre-line}
.skills{display:flex;flex-wrap:wrap;gap:6px}.skills span{background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);padding:2px 11px;border-radius:99px;font-size:9.5pt;font-weight:600}
/* classic */
.tpl-classic .hd{background:#fff;color:#111;border-bottom:3px solid var(--acc);padding-bottom:6mm}
.tpl-classic .title{color:var(--acc);opacity:1}
.tpl-classic .contact{color:#475569}
.tpl-classic .skills span{background:none;border:1px solid #cbd5e1;color:#1e293b}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:0 16px 30px}
.fab{display:none}
@media(max-width:940px){
  .preview{position:static}.pvhead{color:var(--fg)}
  .fab{display:block;position:fixed;bottom:14px;inset-inline:16px;z-index:9;border:0;border-radius:99px;padding:14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 8px 24px #4f46e577}
  .sheet{zoom:.6}
}
@media print{
  body{background:#fff}.hero,.panel,.pvhead,.fab,.foot{display:none}
  .app{display:block;padding:0;margin:0;max-width:none}.preview{position:static}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:0;border-radius:0;zoom:1}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
}
.langsw{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.langsw button{border:1px solid #ffffff66;background:#ffffff1f;color:#fff;padding:5px 14px;border-radius:99px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.langsw button.on{background:#fff;color:#4f46e5}
/* template picker */
.tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tplgrid button{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:6px 4px 4px;cursor:pointer;font:inherit;font-size:.72rem;font-weight:600;color:var(--fg)}
.tplgrid button.on{border-color:var(--ui);background:#eef2ff}
.tplgrid svg{display:block;width:100%;height:auto;margin-bottom:2px}
/* more templates */
.tpl-minimal .hd{background:#fff;color:#111;padding-bottom:4mm}
.tpl-minimal h2{font-weight:300;letter-spacing:.04em;font-size:28pt}
.tpl-minimal .title{color:#64748b;opacity:1;letter-spacing:.12em;text-transform:uppercase;font-size:10pt}
.tpl-minimal .contact{color:#475569;border-top:1px solid #e2e8f0;padding-top:6px;margin-top:8px}
.tpl-minimal h3{color:#0f172a;text-transform:uppercase;letter-spacing:.14em;font-size:9.5pt}
.tpl-minimal h3::after{display:none}
.tpl-minimal .skills span{background:none;color:#334155;padding:0;font-weight:400}
.tpl-minimal .skills span:not(:last-child)::after{content:" ·";margin-inline-start:6px}
.tpl-elegant{font-family:Georgia,"Times New Roman",serif}
.tpl-elegant .hd{background:#fff;color:#111;text-align:center;padding-bottom:5mm}
.tpl-elegant .hd .contact{justify-content:center;color:#475569}
.tpl-elegant .hd{border-bottom:1px solid var(--acc);margin:0 15mm;padding-inline:0}
.tpl-elegant h2{font-weight:400;letter-spacing:.06em;font-size:27pt}
.tpl-elegant .title{color:var(--acc);opacity:1;font-style:italic}
.tpl-elegant h3{justify-content:center;text-transform:uppercase;letter-spacing:.16em;font-size:10pt;color:#111}
.tpl-elegant h3::before{content:"";flex:1;height:1px;background:var(--acc);opacity:.4}
.tpl-elegant .skills{justify-content:center}.tpl-elegant .skills span{background:none;border:1px solid var(--acc);color:#111;font-weight:400}
.tpl-bold .hd{background:#fff;color:#111;border-inline-start:12px solid var(--acc);margin:12mm 15mm 0;padding:2mm 0 3mm 5mm;padding-inline:6mm 0}
.tpl-bold h2{font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:25pt}
.tpl-bold .title{color:var(--acc);opacity:1;font-weight:700}
.tpl-bold .contact{color:#475569}
.tpl-bold h3{background:var(--acc);color:#fff;padding:2px 10px;border-radius:4px;width:fit-content}
.tpl-bold h3::after{display:none}
.tpl-bold .skills span{background:#0f172a;color:#fff}
.tpl-sidebar .sb{display:grid;grid-template-columns:62mm 1fr;min-height:297mm}
.tpl-sidebar aside{background:var(--acc);color:#fff;padding:14mm 8mm}
.tpl-sidebar aside h3{color:#fff;font-size:10pt;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
.tpl-sidebar aside h3::after{background:#fff}
.tpl-sidebar aside .ct{display:block;font-size:9.5pt;margin-bottom:5px;word-break:break-word;opacity:.95}
.tpl-sidebar aside .skills span{background:#ffffff2b;color:#fff}
.tpl-sidebar main{padding:14mm 11mm}
.tpl-sidebar main h2{font-size:25pt;font-weight:800;color:#0f172a}
.tpl-sidebar main .title{color:var(--acc);font-size:13pt;margin:2px 0 4px;font-weight:700}
.tpl-sidebar aside p{font-size:9.5pt}
.phrow{display:flex;align-items:center;gap:10px;margin-top:4px}
.phrow img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--bd)}
.phbtn,.phrm{padding:8px 14px;border-radius:10px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;margin:0}
.phbtn{background:#eef2ff;color:var(--ui);border:1.5px dashed var(--ui)}
.phrm{background:#fee2e2;color:#dc2626;border:0}
.sheet .hd{position:relative}
.sheet .ph{position:absolute;top:10mm;inset-inline-end:15mm;width:34mm;height:34mm;border-radius:50%;object-fit:cover;border:3px solid #ffffffee;outline:1px solid #0000001a}
.sheet .hd.hasph{padding-inline-end:54mm}
.tpl-elegant .hd.hasph{padding-inline:40mm}
.tpl-elegant .ph{inset-inline-end:0;top:9mm}
.tpl-bold .ph{inset-inline-end:0;top:2mm}
.tpl-bold .hd.hasph{padding-inline-end:40mm}
.tpl-sidebar aside .ph{position:static;display:block;margin:0 auto 10px;width:36mm;height:36mm}
</style>
</head>
<body>
<header class="hero">
  <div class="langsw" id="langsw"><button data-l="en">English</button><button data-l="fr">Français</button></div>
  <span class="pill" data-t="pill"></span>
  <h1><span data-t="brand"></span><small data-t="brand2"></small></h1>
  <p data-t="lead"></p>
  <div class="feats"><span data-t="f1"></span><span data-t="f2"></span><span data-t="f3"></span></div>
  <a class="cta" href="#form" data-t="cta"></a>
</header>
<div class="app">
  <section class="panel" id="form">
    
    <div class="row top" style="grid-template-columns:1fr">
      <input type="hidden" id="lang" value="en"><div style="grid-column:1/-1"><label data-t="tpl"></label><div class="tplgrid" id="tplgrid"></div></div>
      <div><label data-t="color"></label>
        <select id="color" hidden><option value="#4f46e5">Indigo</option><option value="#0891b2">Cyan</option><option value="#059669">Green</option><option value="#7c3aed">Purple</option><option value="#db2777">Pink</option><option value="#b91c1c">Red</option><option value="#0f172a">Black</option></select>
        <div class="colors" id="sw"></div></div>
    </div>
    <input type="hidden" id="tpl" value="modern">

    <div class="step"><i>1</i><span data-t="s1"></span></div><fieldset>
      <label data-t="photo"></label>
      <div class="phrow"><img id="phprev" alt="" hidden><label class="phbtn" for="phfile" data-t="addphoto"></label><input type="file" id="phfile" accept="image/*" hidden><button type="button" class="phrm" id="phrm" data-t="rmphoto" hidden></button></div>
      <label data-t="name"></label><input id="name">
      <label data-t="jobtitle"></label><input id="title">
      <div class="row">
        <div><label data-t="phone"></label><input id="phone" dir="ltr"></div>
        <div><label data-t="email"></label><input id="email" dir="ltr"></div>
      </div>
      <label data-t="city"></label><input id="city">
      <label data-t="link"></label><input id="link" dir="ltr">
    </fieldset>

    <div class="step"><i>2</i><span data-t="s2"></span></div><fieldset>
      <textarea id="summary" data-ph="ph_sum"></textarea>
    </fieldset>

    <div class="step"><i>3</i><span data-t="s3"></span></div><fieldset><div id="exp"></div>
      <button class="add" data-add="exp" data-t="addexp"></button></fieldset>

    <div class="step"><i>4</i><span data-t="s4"></span></div><fieldset><div id="edu"></div>
      <button class="add" data-add="edu" data-t="addedu"></button></fieldset>

    <div class="step"><i>5</i><span data-t="s5"></span></div><fieldset>
      <label data-t="sk_hint"></label>
      <textarea id="skills" data-ph="ph_sk"></textarea>
    </fieldset>

    <div class="step"><i>6</i><span data-t="s6"></span></div><fieldset>
      <textarea id="langs" data-ph="ph_lg"></textarea>
    </fieldset>

    <div class="actions">
      <button class="pdf" id="print" data-t="pdf"></button>
      <button class="clr" id="clear" data-t="clear"></button>
    </div>
    <p class="note" data-t="note"></p>
  </section>

  <section class="preview"><div class="pvhead"><span data-t="preview"></span><span>A4</span></div><div class="sheet" id="sheet"></div></section>
</div>
<button class="fab" id="fab" data-t="fab"></button>
<div class="foot" data-t="foot"></div>

  const c = $('color').value || '#4f46e5', L = T[$('lang').value];
  $('tplgrid').innerHTML = TPLS.map((id,i) => `<button type="button" data-tp="${id}" class="${id===$('tpl').value?'on':''}"><svg viewBox="0 0 60 70" preserveAspectRatio="xMidYMid slice"><rect width="60" height="70" fill="#fff" stroke="#e2e8f0"/>${THUMB[id].replace(/"C"/g,'"'+c+'"')}</svg>${L.tpls[i]}</button>`).join('');
}
const t = k => T[$('lang').value][k];
function applyLang(){
  const L = T[$('lang').value];
  document.documentElement.lang = $('lang').value; document.documentElement.dir = L.dir;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = L[el.dataset.ph]);
  drawTpl();
  document.querySelectorAll('#langsw button').forEach(b => b.classList.toggle('on', b.dataset.l===$('lang').value));
  document.title = L.pagetitle;
}
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d){ state = d.state||state; fields.forEach(f => { if(d[f]!==undefined) $(f).value = d[f]; }); } }catch(e){}
}
function save(){
  try{ const d = { state }; fields.forEach(f => d[f] = $(f).value); localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
}

const schema = {
  exp: [['role','role'],['org','org'],['period','period'],['desc','desc','ta']],
  edu: [['degree','degree'],['org','school'],['period','period']]
};
function renderForm(){
  for(const k of ['exp','edu']){
    $(k).innerHTML = state[k].map((it,i) => `<div class="item">
      <button class="rm" data-rm="${k}:${i}" title="${t('del')}">×</button>
      ${schema[k].map(([f,l,ta]) => `<label>${t(l)}</label>` + (ta ? `<textarea data-k="${k}" data-i="${i}" data-f="${f}">${esc(it[f])}</textarea>`
        : `<input data-k="${k}" data-i="${i}" data-f="${f}" value="${esc(it[f])}">`)).join('')}</div>`).join('');
  }
}
function renderSheet(){
  const v = f => $(f).value.trim();
  const sh = $('sheet');
  sh.dir = T[v('lang')].dir; sh.className = 'sheet tpl-' + v('tpl');
  sh.style.setProperty('--acc', v('color'));
  const L = T[v('lang')];
  const contact = [v('phone'),v('email'),v('city'),v('link')].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');
  const block = (key, arr, fn) => { const h = arr.filter(it => Object.values(it).some(Boolean)).map(fn).join(''); return h ? `<h3>${L[key]}</h3>${h}` : ''; };
  const name = esc(v('name')) || L.yourname;
  const ph = state.photo ? `<img class="ph" src="${state.photo}" alt="">` : '';
  const sum = v('summary') ? `<h3>${L.sum}</h3><p>${esc(v('summary'))}</p>` : '';
  const exp = block('exp', state.exp, e => `<div class="e"><b>${esc(e.role)}</b>${e.org?' — '+esc(e.org):''}<div class="d">${esc(e.period)}</div><p>${esc(e.desc)}</p></div>`);
  const edu = block('edu', state.edu, e => `<div class="e"><b>${esc(e.degree)}</b>${e.org?' — '+esc(e.org):''}<div class="d">${esc(e.period)}</div></div>`);
  const sk = v('skills') ? `<h3>${L.sk}</h3><div class="skills">${v('skills').split(/[,\n]/).map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>` : '';
  const lg = v('langs') ? `<h3>${L.lg}</h3><p>${esc(v('langs'))}</p>` : '';
  if(v('tpl')==='sidebar'){
    const ct = [v('phone'),v('email'),v('city'),v('link')].filter(Boolean).map(x=>`<span class="ct">${esc(x)}</span>`).join('');
    sh.innerHTML = `<div class="sb"><aside>${ph}${ct}${sk}${lg}</aside><main><h2>${name}</h2><div class="title">${esc(v('title'))}</div>${sum}${exp}${edu}</main></div>`;
  } else {
    sh.innerHTML = `<div class="hd${ph?' hasph':''}">${ph}<h2>${name}</h2><div class="title">${esc(v('title'))}</div><div class="contact">${contact}</div></div><div class="bd">${sum}${exp}${edu}${sk}${lg}</div>`;
  }
  document.title = v('name') ? L.doc + ' - ' + v('name') : L.pagetitle;
}
function refresh(){ renderSheet(); save(); }

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.k){ state[t.dataset.k][t.dataset.i][t.dataset.f] = t.value; }
  refresh();
});
document.addEventListener('click', e => {
  const t = e.target;
  if(t.dataset.add){ state[t.dataset.add].push({}); renderForm(); refresh(); }
  if(t.dataset.rm){ const [k,i] = t.dataset.rm.split(':'); state[k].splice(+i,1); if(!state[k].length) state[k].push({}); renderForm(); refresh(); }
});
function syncPh(){ $('phprev').hidden = $('phrm').hidden = !state.photo; if(state.photo) $('phprev').src = state.photo; }
$('phfile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const n = 360, c = document.createElement('canvas'); c.width = c.height = n;
    const m = Math.min(img.width, img.height), sx = (img.width-m)/2, sy = (img.height-m)/2;
    c.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, n, n);
    state.photo = c.toDataURL('image/jpeg', .85); URL.revokeObjectURL(url); e.target.value=''; syncPh(); refresh();
  };
  img.src = url;
};
$('phrm').onclick = () => { delete state.photo; syncPh(); refresh(); };
$('print').onclick = $('fab').onclick = () => window.print();
$('sw').innerHTML = [...$('color').options].map(o=>`<button type="button" style="background:${o.value}" data-c="${o.value}"></button>`).join('');
function paintSw(){ document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on', b.dataset.c===$('color').value)); document.documentElement.style.setProperty('--ui',$('color').value); }
$('langsw').onclick = e => { if(e.target.dataset.l){ $('lang').value = e.target.dataset.l; applyLang(); renderForm(); refresh(); } };
$('tplgrid').onclick = e => { const b = e.target.closest('[data-tp]'); if(b){ $('tpl').value = b.dataset.tp; drawTpl(); refresh(); } };
$('sw').onclick = e => { if(e.target.dataset.c){ $('color').value = e.target.dataset.c; paintSw(); drawTpl(); refresh(); } };
$('clear').onclick = () => { if(confirm(t('confirm'))){ try{localStorage.removeItem(KEY)}catch(e){} location.reload(); } };

load(); if(!T[$('lang').value]) $('lang').value='en'; if(!TPLS.includes($('tpl').value)) $('tpl').value='modern'; applyLang(); syncPh(); if(![...$('color').options].some(o=>o.value===$('color').value)) $('color').selectedIndex=0; renderForm(); renderSheet(); paintSw();
</script>
</body>
</html>
